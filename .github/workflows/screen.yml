name: Watchlist Screen

# Bewusst KEIN `schedule:`-Trigger -- GitHubs eingebauter Cron ist aktuell
# nachweislich unzuverlaessig (teils stundenlange Verzoegerungen bei hoher
# Last). Stattdessen wird dieser Workflow per workflow_dispatch von einem
# externen Cron-Dienst (cron-job.org) ausgeloest. Siehe README.md.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full (alle Kriterien, 1x/Tag nach US-Handelsschluss) oder intraday (nur Kriterien 4,5,6)"
        required: true
        type: choice
        options:
          - full
          - intraday
        default: intraday

permissions:
  contents: write

concurrency:
  group: watchlist-screen
  cancel-in-progress: false

jobs:
  screen:
    # Fest gepinnt statt ubuntu-latest: ubuntu-latest wechselt am 19.10.2026 auf Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # TA-Lib kommt als manylinux-Wheel mit eingebauter C-Bibliothek (libta-lib-*.so im
      # Wheel). Kein apt, kein Build aus dem Quellcode und kein Cache noetig. Der fruehere
      # Cache-Restore nach /usr/local/lib scheiterte ohnehin an fehlenden Schreibrechten
      # (tar exit code 2) und war fuer das Wheel wirkungslos.
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify TA-Lib
        run: python -c "import numpy, talib; print('TA-Lib', talib.__version__, 'SMA check:', talib.SMA(numpy.arange(10.0), 3)[-1])"

      - name: Run screening
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST_CSV_URL: ${{ secrets.WATCHLIST_CSV_URL }}
          WATCHLIST_SHEET_EDIT_URL: ${{ vars.WATCHLIST_SHEET_EDIT_URL }}
        run: python scripts/screen.py --mode ${{ inputs.mode }}

      - name: Commit and push updated data
        run: |
          git config user.name "watchlist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json docs/results.json data/watchlist.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update watchlist data (${{ inputs.mode }} run)"
          # Overlapping runs can still race on the push (concurrency: only serializes
          # this workflow, not a manual push or another actor). Retry a few times with a
          # rebase against origin before giving up, instead of failing outright.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto origin/main and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::Could not push after multiple retries."
          exit 1
