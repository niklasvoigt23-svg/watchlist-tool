<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchlist Signal-Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Watchlist Signal-Dashboard</h1>
  <div id="meta" class="meta">Lade Daten...</div>
  <a id="add-ticker-link" class="add-ticker" href="#" target="_blank" rel="noopener">+ Ticker hinzufuegen</a>
</header>

<main>
  <table id="watchlist-table">
    <thead>
      <tr>
        <th>Ticker</th>
        <th>Kurs</th>
        <th>Signal</th>
        <th>Events heute</th>
      </tr>
    </thead>
    <tbody id="watchlist-body">
    </tbody>
  </table>
  <p id="empty-note" class="empty-note" hidden>Keine Daten vorhanden. Loese den Workflow einmal per workflow_dispatch aus.</p>
</main>

<script>
// Owner/Repo fuer den "Ticker hinzufuegen"-Link.
const REPO = "niklasvoigt23-svg/watchlist-tool";

const EVENT_LABELS = {
  golden_cross: "Golden Cross",
  death_cross: "Death Cross",
  volume_breakout: "Volumen",
  move: "Kursbewegung",
  year_high: "52W-Hoch",
};

function statusLabel(status, reason) {
  if (status === "green") return { text: "GRUEN", cls: "status-green" };
  if (status === "red") return { text: "ROT", cls: "status-red" };
  if (reason === "insufficient_history") return { text: "zu wenig Historie", cls: "status-grey" };
  if (reason === "insufficient_fundamentals") return { text: "Daten unvollst.", cls: "status-grey" };
  return { text: "keine Daten", cls: "status-grey" };
}

function statusCell(block) {
  if (!block) return `<span class="status-dot status-grey"></span>keine Daten`;
  const info = statusLabel(block.status, block.reason);
  return `<span class="status-dot ${info.cls}"></span>${info.text}`;
}

const SIGNAL_LABELS = {
  trendstruktur: "Trendstruktur",
  relative_staerke: "Relative Staerke",
  fundamental: "Fundamental",
};

// Eine Ampel: rot wenn irgendein Kriterium rot ist (das ist ein echtes "nicht erfuellt"),
// grau wenn keins rot aber mind. eins grau ist (noch nicht abschliessend beurteilbar),
// gruen nur wenn alle drei gruen sind.
function combinedStatus(t) {
  const parts = [t.trendstruktur, t.relative_staerke, t.fundamental];
  const statuses = parts.map((p) => (p ? p.status : "grey"));
  if (statuses.includes("red")) return "red";
  if (statuses.includes("grey")) return "grey";
  return "green";
}

function signalCell(t) {
  const combined = combinedStatus(t);
  const cls = combined === "green" ? "status-green" : combined === "red" ? "status-red" : "status-grey";
  const detailRows = ["trendstruktur", "relative_staerke", "fundamental"]
    .map((key) => `<div class="signal-detail-row">${SIGNAL_LABELS[key]}: ${statusCell(t[key])}</div>`)
    .join("");
  return `
    <details class="signal-details">
      <summary><span class="status-dot status-dot-lg ${cls}"></span></summary>
      <div class="signal-detail-panel">${detailRows}</div>
    </details>
  `;
}

function eventBadges(events) {
  if (!events || events.length === 0) return "";
  return events
    .map((e) => {
      const label = EVENT_LABELS[e.type] || e.type;
      const text = e.value ? `${label} ${e.value}` : label;
      const cls = e.type === "golden_cross" || e.type === "death_cross" ? "badge-cross"
        : e.type === "volume_breakout" ? "badge-volume"
        : e.type === "year_high" ? "badge-year-high"
        : "badge-move";
      return `<span class="badge ${cls}">${text}</span>`;
    })
    .join(" ");
}

function fmtPrice(price) {
  if (price === undefined || price === null) return "-";
  return price.toFixed(2);
}

function fmtTimestamp(iso) {
  if (!iso) return "noch nie gelaufen";
  const d = new Date(iso);
  return d.toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" });
}

async function load() {
  const addLink = document.getElementById("add-ticker-link");
  addLink.href = `https://github.com/${REPO}/edit/main/data/watchlist.csv`;

  let data;
  try {
    const resp = await fetch("results.json?_=" + Date.now());
    data = await resp.json();
  } catch (e) {
    document.getElementById("meta").textContent = "Fehler beim Laden von results.json: " + e;
    return;
  }

  document.getElementById("meta").textContent =
    `Letzter Lauf: ${fmtTimestamp(data.last_run_at)} (${data.last_run_mode || "-"})`;

  const tickers = data.tickers || {};
  const tbody = document.getElementById("watchlist-body");
  tbody.innerHTML = "";
  const names = Object.keys(tickers).sort();

  if (names.length === 0) {
    document.getElementById("empty-note").hidden = false;
    return;
  }

  for (const ticker of names) {
    const t = tickers[ticker];
    const row = document.createElement("tr");

    row.innerHTML = `
      <td class="ticker-cell"><a href="https://finance.yahoo.com/quote/${encodeURIComponent(ticker)}" target="_blank" rel="noopener">${ticker}</a></td>
      <td>${t.data_status === "ok" ? fmtPrice(t.price) : "-"}</td>
      <td class="signal-cell">${signalCell(t)}</td>
      <td>${eventBadges(t.events_today)}</td>
    `;

    if (t.data_status && t.data_status !== "ok") {
      row.classList.add("row-no-data");
      row.title = t.error || "Keine Daten verfuegbar";
    }

    tbody.appendChild(row);
  }
}

load();
</script>
</body>
</html>
